  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-bottom:0;\"><svg class=\"nhd-icon\" width=\"22\" height=\"22\"><use href=\"#i-well\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div><div class=\"radio-card-name\">Private well + absorption septic<\u002Fdiv><div class=\"radio-card-desc\">Most common for rural sites. Requires perc test and setback compliance.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"radio-card\" data-radio=\"4\" style=\"display:flex;align-items:center;gap:var(--sp-5);\">\n            <div class=\"radio-card-icon\" style=\"margin-bottom:0;\"><svg class=\"nhd-icon\" width=\"22\" height=\"22\"><use href=\"#i-municipal\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div><div class=\"radio-card-name\">Municipal water + sewer<\u002Fdiv><div class=\"radio-card-desc\">Connect to existing infrastructure.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"radio-card\" data-radio=\"4\" style=\"display:flex;align-items:center;gap:var(--sp-5);\">\n            <div class=\"radio-card-icon\" style=\"margin-bottom:0;\"><svg class=\"nhd-icon\" width=\"22\" height=\"22\"><use href=\"#i-rainwater\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div><div class=\"radio-card-name\">Rainwater harvest + constructed wetland<\u002Fdiv><div class=\"radio-card-desc\">Off-grid water. Requires state permit. Not potable in most jurisdictions without treatment.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <div class=\"wizard-footer\">\n      <div class=\"wizard-dots\" id=\"wizardDots\"><\u002Fdiv>\n      <div class=\"wizard-nav\">\n        <button class=\"wiz-btn wiz-btn-back\" id=\"wizBack\">← Back<\u002Fbutton>\n        <button class=\"wiz-btn wiz-btn-next\" id=\"wizNext\">Next →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── AI CHAT ── -->\n<div class=\"chat-float-btn\" id=\"chatFloatBtn\" title=\"AI Copilot\"><svg class=\"nhd-icon\" width=\"18\" height=\"18\"><use href=\"#i-chat\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n<div class=\"chat-panel-wrap\" id=\"chatPanel\">\n  <div class=\"chat-panel-header\">\n    <div class=\"chat-panel-title\" style=\"display:flex;align-items:center;gap:6px;\"><svg class=\"nhd-icon\" width=\"13\" height=\"13\"><use href=\"#i-chat\"><\u002Fuse><\u002Fsvg>AI Copilot<\u002Fdiv>\n    <div class=\"chat-panel-close\" id=\"chatClose\">✕<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"chat-messages\">\n    <div class=\"chat-msg\">\n      <div class=\"chat-avatar ai\">NH<\u002Fdiv>\n      <div class=\"chat-bubble ai\">I can help with code compliance, material specs, sizing, or system selection. What would you like to explore?<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chat-msg user\">\n      <div class=\"chat-avatar user\">You<\u002Fdiv>\n      <div class=\"chat-bubble user\">Will my well depth pass for Montana DEQ?<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chat-msg\">\n      <div class=\"chat-avatar ai\">NH<\u002Fdiv>\n      <div class=\"chat-bubble ai\">Montana DEQ requires 50 ft minimum in Class B soils. Your current depth of 42 ft is below that. Deepen to ≥50 ft, or request a soil reclassification via perc test.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"chat-input-row\">\n    <textarea class=\"chat-textarea\" rows=\"1\" placeholder=\"Ask about code, materials…\"><\u002Ftextarea>\n    <button class=\"chat-send\">↑<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}\n}\">\nclass Component extends DCLogic {\n  currentMode = 'edit';\n  currentSection = 'envelope';\n  wizardStep = 1;\n  totalWizardSteps = 4; // demo steps; indicates 14 total\n\n  componentDidMount() {\n    const el = this.el;\n\n    // ── Mode switching ────────────────────────────────────\n    const switchMode = (target) => {\n      this.currentMode = target;\n      el.querySelectorAll('.mode-view').forEach(v => {\n        v.classList.toggle('active', v.dataset.view === target);\n      });\n      el.querySelectorAll('.mode-btn').forEach(b => {\n        b.classList.toggle('active', b.dataset.mode === target);\n      });\n    };\n\n    el.querySelectorAll('.mode-btn').forEach(btn => {\n      btn.addEventListener('click', () => switchMode(btn.dataset.mode));\n    });\n\n    // start-mode path buttons\n    const goEdit = () => switchMode('edit');\n    const goPreview = () => switchMode('preview');\n\n    const wizardBtn = el.querySelector('#startWizard');\n    if (wizardBtn) wizardBtn.addEventListener('click', () => {\n      this.openWizard();\n    });\n    const exampleBtn = el.querySelector('#startExample');\n    if (exampleBtn) exampleBtn.addEventListener('click', goEdit);\n    const jsonBtn = el.querySelector('#startJSON');\n    if (jsonBtn) jsonBtn.addEventListener('click', goEdit);\n    const aiBtn = el.querySelector('#startAI');\n    if (aiBtn) { aiBtn.addEventListener('click', () => { switchMode('edit'); this.openChat(); }); }\n    const jumpBtn = el.querySelector('#startJumpEdit');\n    if (jumpBtn) jumpBtn.addEventListener('click', goEdit);\n\n    // output: 3d thumb → preview\n    const thumbBtn = el.querySelector('#switchToPreview');\n    if (thumbBtn) thumbBtn.addEventListener('click', () => switchMode('preview'));\n\n    // ── Section tabs in Edit mode ─────────────────────────\n    el.querySelectorAll('.sec-tab').forEach(tab => {\n      tab.addEventListener('click', () => {\n        const target = tab.dataset.sec;\n        this.currentSection = target;\n        el.querySelectorAll('.sec-tab').forEach(t => t.classList.toggle('active', t.dataset.sec === target));\n        el.querySelectorAll('.sec-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === target));\n      });\n    });\n\n    // ── Layer panels ──────────────────────────────────────\n    const setupLayers = (toggleId, panelId) => {\n      const btn = el.querySelector(`#${toggleId}`);\n      const panel = el.querySelector(`#${panelId}`);\n      if (btn && panel) {\n        btn.addEventListener('click', (e) => {\n          e.stopPropagation();\n          panel.classList.toggle('open');\n        });\n      }\n    };\n    setupLayers('layersTogglePreview', 'layersPanelPreview');\n    setupLayers('layersToggleEdit', 'layersPanelEdit');\n\n    el.querySelectorAll('.layer-eye').forEach(eye => {\n      eye.addEventListener('click', e => {\n        e.stopPropagation();\n        const isOff = eye.style.opacity === '0.25';\n        eye.style.opacity = isOff ? '1' : '0.25';\n      });\n    });\n\n    document.addEventListener('click', () => {\n      el.querySelectorAll('.layers-panel.open').forEach(p => p.classList.remove('open'));\n    });\n\n    // ── Viewport tools toggle ─────────────────────────────\n    el.querySelectorAll('.viewport-tool').forEach(tool => {\n      tool.addEventListener('click', () => {\n        const group = tool.closest('.viewport-tools');\n        if (!group) return;\n        group.querySelectorAll('.viewport-tool').forEach(t => t.classList.remove('on'));\n        tool.classList.add('on');\n      });\n    });\n\n    // ── Compact mode toggle ───────────────────────────────\n    const compactToggle = el.querySelector('#compactToggle');\n    const shell = el.querySelector('#appShell');\n    if (compactToggle && shell) {\n      compactToggle.addEventListener('click', () => {\n        compactToggle.classList.toggle('on');\n        shell.classList.toggle('compact');\n      });\n    }\n\n    // ── Output nav ────────────────────────────────────────\n    const outputTitle = el.querySelector('#outputDocTitle');\n    const outputLabel = el.querySelector('#outputDrawingLabel');\n    const titles = {\n      floorplan: 'Floor Plan · Scale 1:48',\n      sections: 'Wall Sections · Scale 1:24',\n      elevations: 'Elevations · Scale 1:48',\n      details: 'Construction Details · Scale 1:12',\n      pe: 'PE Structural Package',\n      permit: 'Permit Set',\n      lender: 'Lender Package',\n      bom: 'Bill of Materials',\n      schedule: 'Material Schedule',\n    };\n    const labels = {\n      floorplan: 'Floor Plan A1.1 · Natural House · Ravalli Co. MT',\n      sections: 'Wall Section A3.1 · Strawbale LB 18 in',\n      elevations: 'South Elevation A2.1',\n      details: 'Foundation Detail D1.2',\n      pe: 'PE Package · Structural Calculations',\n      permit: 'Permit Set · AHJ Submittal',\n      lender: 'Lender Package · Appraisal Support',\n      bom: 'BOM · 1,728 ft² · $284,600 est.',\n      schedule: 'Material Schedule Rev. 3',\n    };\n    el.querySelectorAll('.output-item').forEach(item => {\n      item.addEventListener('click', () => {\n        el.querySelectorAll('.output-item').forEach(i => i.classList.remove('active'));\n        item.classList.add('active');\n        const key = item.dataset.output;\n        if (outputTitle && titles[key]) outputTitle.textContent = titles[key];\n        if (outputLabel && labels[key]) outputLabel.textContent = labels[key];\n      });\n    });\n\n    // ── Radio cards ───────────────────────────────────────\n    el.querySelectorAll('.radio-card').forEach(card => {\n      card.addEventListener('click', () => {\n        const group = card.dataset.radio;\n        el.querySelectorAll(`.radio-card[data-radio=\"${group}\"]`).forEach(c => c.classList.remove('selected'));\n        card.classList.add('selected');\n      });\n    });\n\n    // ── Wizard ────────────────────────────────────────────\n    this.openWizard = () => {\n      const bd = el.querySelector('#wizardBackdrop');\n      if (bd) bd.classList.add('open');\n      this.wizardStep = 1;\n      this.renderWizard();\n    };\n    const closeWizard = () => {\n      const bd = el.querySelector('#wizardBackdrop');\n      if (bd) bd.classList.remove('open');\n    };\n    const closeBtn = el.querySelector('#wizardClose');\n    if (closeBtn) closeBtn.addEventListener('click', closeWizard);\n    const backdrop = el.querySelector('#wizardBackdrop');\n    if (backdrop) backdrop.addEventListener('click', e => { if (e.target === backdrop) closeWizard(); });\n\n    const wizBack = el.querySelector('#wizBack');\n    const wizNext = el.querySelector('#wizNext');\n    if (wizBack) wizBack.addEventListener('click', () => {\n      if (this.wizardStep > 1) { this.wizardStep--; this.renderWizard(); }\n    });\n    if (wizNext) wizNext.addEventListener('click', () => {\n      if (this.wizardStep < this.totalWizardSteps) { this.wizardStep++; this.renderWizard(); }\n      else { closeWizard(); switchMode('edit'); }\n    });\n\n    this.renderWizard = () => {\n      const step = this.wizardStep;\n      const badge = el.querySelector('#wizardStepBadge');\n      const bar = el.querySelector('#wizardBar');\n      if (badge) badge.textContent = `Step ${step} of 14`;\n      if (bar) bar.style.width = `${(step / 14) * 100}%`;\n\n      const titles = {\n        1: ['What\\'s your primary structure?', 'This determines the load path and which IRC provisions apply.'],\n        2: ['How large is your house?', 'Set the target conditioned floor area. Refine room-by-room in Edit mode.'],\n        3: ['Where is your site?', 'County is used to look up climate zone, snow load, frost depth, and AHJ code.'],\n        4: ['Water &amp; wastewater systems?', 'This affects setback calculations and compliance requirements.'],\n      };\n      const t = el.querySelector('#wizardTitle');\n      const s = el.querySelector('#wizardSubtitle');\n      if (t && titles[step]) t.innerHTML = titles[step][0];\n      if (s && titles[step]) s.innerHTML = titles[step][1];\n\n      el.querySelectorAll('.wizard-step').forEach(ws => {\n        ws.classList.toggle('active', parseInt(ws.dataset.step) === step);\n      });\n\n      // dots\n      const dotsEl = el.querySelector('#wizardDots');\n      if (dotsEl) {\n        dotsEl.innerHTML = '';\n        for (let i = 1; i <= 14; i++) {\n          const d = document.createElement('div');\n          d.className = 'wizard-dot' + (i === step ? ' active' : '') + (i < step ? ' done' : '');\n          dotsEl.appendChild(d);\n        }\n      }\n\n      const backBtn = el.querySelector('#wizBack');\n      if (backBtn) backBtn.style.visibility = step === 1 ? 'hidden' : 'visible';\n      const nextBtn = el.querySelector('#wizNext');\n      if (nextBtn) nextBtn.textContent = step >= this.totalWizardSteps ? '✓ Apply &amp; Edit' : 'Next →';\n    };\n    this.renderWizard();\n\n    // area slider\n    const areaSlider = el.querySelector('#areaSlider');\n    const areaVal = el.querySelector('#areaVal');\n    const baleCount = el.querySelector('#baleCount');\n    const bomEst = el.querySelector('#bomEst');\n    if (areaSlider) {\n      areaSlider.addEventListener('input', () => {\n        const v = parseInt(areaSlider.value);\n        if (areaVal) areaVal.innerHTML = `${v.toLocaleString()}<br><span style=\"font-size:12px;color:var(--chrome-3);\">ft²<\u002Fspan>`;\n        if (baleCount) baleCount.textContent = `~${Math.round(v * 0.25)}`;\n        if (bomEst) bomEst.textContent = `$${Math.round(v * 145 / 1000)}k`;\n      });\n    }\n\n    // ── AI Chat ───────────────────────────────────────────\n    this.openChat = () => {\n      const panel = el.querySelector('#chatPanel');\n      if (panel) panel.classList.add('open');\n      const floatBtn = el.querySelector('#chatFloatBtn');\n      if (floatBtn) floatBtn.style.display = 'none';\n    };\n    const chatFloatBtn = el.querySelector('#chatFloatBtn');\n    const chatPanel = el.querySelector('#chatPanel');\n    const chatClose = el.querySelector('#chatClose');\n    if (chatFloatBtn) chatFloatBtn.addEventListener('click', this.openChat);\n    if (chatClose) chatClose.addEventListener('click', () => {\n      if (chatPanel) chatPanel.classList.remove('open');\n      if (chatFloatBtn) chatFloatBtn.style.display = 'flex';\n    });\n\n    // Generate btn feedback + viewport pulse\n    const genBtn = el.querySelector('#generateBtn');\n    if (genBtn) {\n      genBtn.addEventListener('click', () => {\n        genBtn.textContent = '⟳ Sending to Blender…';\n        genBtn.style.opacity = '0.7';\n        // pulse viewports\n        el.querySelectorAll('.viewport').forEach(vp => {\n          vp.style.transition = 'opacity .3s';\n          vp.style.opacity = '0.4';\n          setTimeout(() => { vp.style.opacity = '1'; }, 600);\n          setTimeout(() => { vp.style.opacity = '0.6'; }, 900);\n          setTimeout(() => { vp.style.opacity = '1'; }, 1400);\n        });\n        const iconSvg = `<svg class=\"nhd-icon-inline\" width=\"13\" height=\"13\" style=\"margin-right:4px;\"><use href=\"#i-hex\"/><\u002Fsvg>`;\n        setTimeout(() => {\n          genBtn.innerHTML = `${iconSvg}Model updated`;\n          genBtn.style.opacity = '1';\n          genBtn.style.background = 'var(--sage-0)';\n          genBtn.style.borderColor = 'var(--sage-0)';\n        }, 1400);\n        setTimeout(() => {\n          genBtn.innerHTML = `${iconSvg}Generate Model`;\n          genBtn.style.background = '';\n          genBtn.style.borderColor = '';\n        }, 3000);\n      });\n    }\n\n    // ── Universal draggable sliders ────────────────────────\n    // Config map keyed by label text substring\n    const sliderConfigs = {\n      'Width':                  { min:20,  max:80,  unit:' ft',  step:1  },\n      'Length':                 { min:20,  max:100, unit:' ft',  step:1  },\n      'Ceiling height':         { min:8,   max:14,  unit:' ft',  step:.5 },\n      'Nominal bale':           { min:14,  max:24,  unit:' in',  step:1  },\n      'Window-to-wall':         { min:8,   max:55,  unit:'%',    step:1  },\n      'South glazing':          { min:20,  max:85,  unit:'%',    step:1  },\n      'Pitch':                  { min:2,   max:12,  unit:':12',  step:.5 },\n      'Overhang':               { min:12,  max:48,  unit:' in',  step:1  },\n      'Target R-value':         { min:30,  max:90,  unit:'',     step:1, prefix:'R-' },\n      'Frost depth':            { min:12,  max:72,  unit:' in',  step:1  },\n      'Well depth':             { min:20,  max:200, unit:' ft',  step:1  },\n      'Array size':             { min:2,   max:20,  unit:' kW',  step:.5 },\n      'South orientation':      { min:-45, max:45,  unit:'°',    step:1  },\n      'Ground snow':            { min:20,  max:120, unit:' psf', step:5  },\n      'Design wind':            { min:85,  max:160, unit:' mph', step:5  },\n      'Front yard':             { min:5,   max:60,  unit:' ft',  step:1  },\n      'Side yard':              { min:3,   max:30,  unit:' ft',  step:1  },\n      'Setback to well':        { min:20,  max:200, unit:' ft',  step:1  },\n    };\n\n    const getConfig = (row) => {\n      const group = row.closest('.field-group');\n      const labelEl = group ? group.querySelector('.field-label') : null;\n      if (!labelEl) return null;\n      const labelText = labelEl.textContent;\n      for (const [key, cfg] of Object.entries(sliderConfigs)) {\n        if (labelText.includes(key)) return cfg;\n      }\n      return { min:0, max:100, unit:'%', step:1 };\n    };\n\n    const pctToVal = (pct, cfg) => {\n      const raw = cfg.min + pct * (cfg.max - cfg.min);\n      const stepped = Math.round(raw / cfg.step) * cfg.step;\n      return Math.max(cfg.min, Math.min(cfg.max, stepped));\n    };\n\n    const formatVal = (v, cfg) => {\n      const prefix = cfg.prefix || '';\n      const num = (cfg.step < 1) ? v.toFixed(1) : Math.round(v);\n      return `${prefix}${num}${cfg.unit}`;\n    };\n\n    el.querySelectorAll('.slider-row').forEach(row => {\n      const track = row.querySelector('.slider-track');\n      const fill  = row.querySelector('.slider-fill');\n      const thumb = row.querySelector('.slider-thumb');\n      const valEl = row.querySelector('.slider-val');\n      if (!track || !fill || !thumb) return;\n\n      track.style.cursor = 'ew-resize';\n      thumb.style.cursor = 'ew-resize';\n\n      const applyPct = (pct) => {\n        pct = Math.max(0.01, Math.min(0.99, pct));\n        fill.style.width  = (pct * 100) + '%';\n        thumb.style.left  = (pct * 100) + '%';\n        if (valEl) {\n          const cfg = getConfig(row);\n          if (cfg) valEl.textContent = formatVal(pctToVal(pct, cfg), cfg);\n        }\n        // update label inline value if present\n        const group = row.closest('.field-group');\n        const label = group?.querySelector('.field-label');\n        if (label && valEl) {\n          const span = label.querySelector('span');\n          if (span) span.textContent = valEl.textContent;\n        }\n      };\n\n      let dragging = false;\n      const startDrag = (clientX) => {\n        dragging = true;\n        moveDrag(clientX);\n      };\n      const moveDrag = (clientX) => {\n        const rect = track.getBoundingClientRect();\n        applyPct((clientX - rect.left) / rect.width);\n      };\n\n      track.addEventListener('mousedown',  e => { e.preventDefault(); startDrag(e.clientX); });\n      track.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX); }, { passive:false });\n      document.addEventListener('mousemove',  e => { if (dragging) moveDrag(e.clientX); });\n      document.addEventListener('touchmove',  e => { if (dragging) moveDrag(e.touches[0].clientX); }, { passive:false });\n      document.addEventListener('mouseup',  () => { dragging = false; });\n      document.addEventListener('touchend', () => { dragging = false; });\n    });\n\n    // ── Output view switching (BOM / compliance / drawing) ─\n    const outViewDrawing    = el.querySelector('#outViewDrawing');\n    const outViewBOM        = el.querySelector('#outViewBOM');\n    const outViewCompliance = el.querySelector('#outViewCompliance');\n\n    const drawingKeys  = new Set(['floorplan','sections','elevations','details']);\n    const bomKeys      = new Set(['bom','schedule']);\n    const complianceKeys = new Set(['pe','permit','lender']);\n\n    el.querySelectorAll('.output-item').forEach(item => {\n      item.addEventListener('click', () => {\n        el.querySelectorAll('.output-item').forEach(i => i.classList.remove('active'));\n        item.classList.add('active');\n        const key = item.dataset.output;\n\n        if (outViewDrawing)    outViewDrawing.classList.toggle('active',    drawingKeys.has(key));\n        if (outViewBOM)        outViewBOM.classList.toggle('active',        bomKeys.has(key));\n        if (outViewCompliance) outViewCompliance.classList.toggle('active', complianceKeys.has(key));\n\n        const titles = {\n          floorplan:'Floor Plan · Scale 1:48', sections:'Wall Sections · Scale 1:24',\n          elevations:'Elevations · Scale 1:48', details:'Construction Details · Scale 1:12',\n          pe:'PE Structural Package — IRC 2021 Review',\n          permit:'Permit Set · AHJ Submittal Package',\n          lender:'Lender Package · Appraisal Support',\n          bom:'Bill of Materials · $284,600 est.',\n          schedule:'Material Schedule · Rev. 3',\n        };\n        const toolbar = el.querySelector('#outputDocTitle');\n        if (toolbar && titles[key]) toolbar.textContent = titles[key];\n      });\n    });\n\n    // ── Preview sidebar → jump to Edit + section ───────────\n    el.querySelectorAll('.acc-item').forEach(item => {\n      const header = item.querySelector('.acc-header');\n      const name   = header?.querySelector('.acc-name')?.textContent?.toLowerCase();\n      if (!header || !name) return;\n\n      const sectionMap = {\n        envelope:'envelope', walls:'walls', roof:'roof',\n        foundation:'foundation', systems:'systems',\n        site:'site', outbuildings:'outbuildings',\n      };\n      const secKey = Object.keys(sectionMap).find(k => name.includes(k));\n      if (!secKey) return;\n\n      header.style.cursor = 'pointer';\n      header.title = `Edit ${secKey} →`;\n      header.addEventListener('click', () => {\n        // switch to edit mode\n        el.querySelectorAll('.mode-view').forEach(v => v.classList.toggle('active', v.dataset.view === 'edit'));\n        el.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'edit'));\n        // activate section\n        el.querySelectorAll('.sec-tab').forEach(t => t.classList.toggle('active', t.dataset.sec === secKey));\n        el.querySelectorAll('.sec-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === secKey));\n      });\n    });\n\n    // check boxes toggle\n    el.querySelectorAll('.check-box').forEach(cb => {\n      cb.addEventListener('click', () => cb.classList.toggle('on'));\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
